name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'pirabyte/erecht24-nuxt' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        nuxt: ['3', '4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save nuxt@${{ matrix.nuxt }}
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:package
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

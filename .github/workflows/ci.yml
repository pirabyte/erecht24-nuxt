name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nuxt: ['3', '4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save nuxt@${{ matrix.nuxt }}
      - run: npm test
      - run: npm run test:integration
      - run: npm pack --dry-run

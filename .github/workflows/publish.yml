name: Publish npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'pirabyte/erecht24-nuxt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.package.outputs.tarball }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(pkg.name, '@pirabyte/erecht24-nuxt')
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`)
          NODE
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - name: Pack release
        id: package
        run: |
          mkdir release
          npm pack --ignore-scripts --json --pack-destination release > release/pack.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync, unlinkSync } from 'node:fs'
          const [artifact] = JSON.parse(readFileSync('release/pack.json', 'utf8'))
          assert.equal(artifact.name, '@pirabyte/erecht24-nuxt')
          assert.equal(process.env.GITHUB_REF_NAME, `v${artifact.version}`)
          assert.match(artifact.filename, /^pirabyte-erecht24-nuxt-\d+\.\d+\.\d+\.tgz$/)
          for (const { path } of artifact.files) {
            assert.ok(path.startsWith('dist/') || ['package.json', 'README.md', 'LICENSE'].includes(path), path)
          }
          const sha256 = createHash('sha256').update(readFileSync(`release/${artifact.filename}`)).digest('hex')
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${artifact.filename}\nsha256=${sha256}\n`)
          unlinkSync('release/pack.json')
          NODE
      - name: Test release tarball
        run: npm run test:package
        env:
          ERECHT24_PACKAGE_TARBALL: ${{ github.workspace }}/release/${{ steps.package.outputs.tarball }}
      - name: Install Nuxt 3 for compatibility check
        run: npm install --no-save --ignore-scripts nuxt@3
      - name: Test Nuxt 3 integration
        run: npm run test:integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'pirabyte/erecht24-nuxt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: release
      - name: Verify publish inputs
        env:
          RELEASE_TARBALL: ${{ needs.build.outputs.tarball }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number)
          assert.ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'npm 11.5.1 or later required')
          assert.match(process.env.RELEASE_TARBALL, /^pirabyte-erecht24-nuxt-\d+\.\d+\.\d+\.tgz$/)
          assert.equal(process.env.RELEASE_TARBALL, `pirabyte-erecht24-nuxt-${process.env.GITHUB_REF_NAME.slice(1)}.tgz`)
          assert.match(process.env.RELEASE_SHA256, /^[a-f0-9]{64}$/)
          const actual = createHash('sha256').update(readFileSync(`release/${process.env.RELEASE_TARBALL}`)).digest('hex')
          assert.equal(actual, process.env.RELEASE_SHA256)
          NODE
      - name: Publish with npm trusted publishing
        env:
          RELEASE_TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "release/$RELEASE_TARBALL" --ignore-scripts --access public --registry=https://registry.npmjs.org
